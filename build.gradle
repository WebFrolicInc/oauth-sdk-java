plugins {  
    id 'java'
	id 'application'
	id 'eclipse'
    id 'java-library'
    id 'maven-publish' 
    id 'signing' 
    id "com.vanniktech.maven.publish" version "0.37.0"  
}




jar {
	archiveBaseName = 'oauth-sdk'
	
}

java {
   
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

import com.vanniktech.maven.publish.Checksum

mavenPublishing {
    publishToMavenCentral(true)
    checksums(Checksum.MD5, Checksum.SHA1)
     signAllPublications()
    excludeSignatureChecksums(false)
}

mavenPublishing {
            coordinates("com.webfrolic.sdk", "oauth-sdk", "1.1.0")        	
            pom {
	                name = 'Webfrolic OAuth SDK'
	                description = 'OAuth SKD to integrate with Webfrolic Identity provider'
	                url = 'https://github.com/WebFrolicInc/oauth-sdk-java'
	                inceptionYear= "2026"
	                licenses {
	                    license {
	                        name = 'The Apache License, Version 2.0'
	                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
	                    }
	                }
	                developers {
	                    developer {
	                        id = 'sandeep'
	                        name = 'Sandeep Dhankar'
	                        email = 'contact@weblegit.com'
	                    }
	                }
					scm {
				      url = "https://github.com/WebFrolicInc/oauth-sdk-java"
				      connection = "scm:git:https://github.com/WebFrolicInc/oauth-sdk-java.git"
				      developerConnection = "scm:git:git@github.com:WebFrolicInc/oauth-sdk-java.git"
				    }
                
             }
       
}


javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}



dependencies {
	implementation("com.nimbusds:nimbus-jose-jwt:10.10")
    compileOnly("jakarta.servlet:jakarta.servlet-api:6.1.0")
    implementation("org.slf4j:slf4j-api:2.0.20")
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation("org.bouncycastle:bcpkix-jdk18on:1.81")
    implementation('com.fasterxml.jackson.core:jackson-databind:2.18.2')
  	implementation('com.fasterxml.jackson.core:jackson-core:2.18.2')
  	implementation('com.fasterxml.jackson.core:jackson-annotations:2.22')
    implementation('commons-io:commons-io:2.6')
    implementation("org.apache.commons:commons-lang3:3.18.0")
	implementation("org.apache.commons:commons-text:1.13.1")
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation("commons-beanutils:commons-beanutils:1.8.0")
  	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
  	testImplementation('junit:junit:4.4')
	

}



test {
	ignoreFailures = true
}

tasks.matching {it instanceof Test}.all {
	testLogging.events = ["failed", "passed", "skipped"]
}

							 
tasks.matching { it.name == "publishMavenJavaPublicationToMavenCentralRepository" }.configureEach {
    dependsOn("signMavenPublication")
}

tasks.matching { it.name == "publishMavenPublicationToMavenCentralRepository" }.configureEach {
    dependsOn("signMavenPublication")
}




